playbook_id: "PB-LOW-004"
name: "PB-LOW-004: Low-Risk Telemetry Noise Reduction & Auto-Archive"
short_name: "Low-Risk Telemetry Noise Reduction & Auto-Archive"
target_tier: "LOW"
condition: "risk_score < 30"
